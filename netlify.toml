[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./dev.db"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "prisma/dev.db",
    "prisma/schema.prisma",
    "node_modules/.prisma/client/*"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
